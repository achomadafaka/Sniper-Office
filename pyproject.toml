[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sniper-office"
version = "0.1.0"
description = "Durable agent turns: store, supervisor lease, typed tool receipts, tickets, written work and memory."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "cryptography"]
seats = ["cryptography"]

[tool.setuptools]
packages = ["sniper_office", "sniper_office.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

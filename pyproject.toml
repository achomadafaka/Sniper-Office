[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sniper-office"
version = "0.1.0"
description = "Durable agent turns: store, supervisor lease, typed tool receipts, tickets, written work and memory."
requires-python = ">=3.11"
dependencies = []   # the durable core and the seat host need only the standard library

[project.optional-dependencies]
test = ["pytest", "cryptography", "jsonschema", "referencing"]
seats = ["cryptography"]
models = ["jsonschema", "referencing"]

[tool.setuptools]
packages = ["sniper_office", "sniper_office.tools"]

[tool.setuptools.package-data]
sniper_office = ["ui_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
